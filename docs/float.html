<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
<title>Float &amp; Shuttle Planner — Lower American River</title>
<meta name="theme-color" content="#005566"/>
<style>
:root{ --ca-blue:#005566; --ca-gold:#FDB913; --teal:#0e7490; --up:#7c3aed; --down:#0891b2;
  --good:#15803D; --caution:#A16207; --warning:#C2410C; --unsafe:#B91C1C; --unknown:#6B7280;
  --bg:#F0F4F8; --text:#1a2332; --sub:#4B5563; --border:#d0d8e4; --radius:8px; }
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',system-ui,Arial,sans-serif;background:var(--bg);color:var(--text);height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;}
a{color:var(--ca-blue);}
header{background:var(--ca-blue);color:#fff;padding:0 14px;height:52px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;box-shadow:0 2px 8px rgba(0,0,0,.35);z-index:1000;}
.hdr-title{font-size:1rem;font-weight:800;line-height:1.05;}
.hdr-title small{display:block;font-size:.64rem;font-weight:400;opacity:.85;}
.hdr-link{color:var(--ca-gold);font-size:.72rem;font-weight:700;text-decoration:none;white-space:nowrap;}
.app-body{flex:1;position:relative;overflow:hidden;}
#map{position:absolute;inset:0;}
.map-hint{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:600;background:rgba(0,85,102,.92);color:#fff;border-radius:20px;padding:7px 15px;font-size:.74rem;font-weight:600;box-shadow:0 3px 12px rgba(0,0,0,.25);pointer-events:none;white-space:nowrap;max-width:92vw;}
.fabs{position:absolute;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:0;right:0;display:flex;justify-content:center;gap:10px;z-index:590;pointer-events:none;}
.fabs button{pointer-events:auto;background:var(--ca-blue);color:#fff;border:none;border-radius:24px;padding:10px 18px;font-size:.85rem;font-weight:700;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.3);}
#locate.on{background:#2563EB;}
#panel{position:absolute;bottom:0;left:0;right:0;z-index:700;background:#fff;border-top:2px solid var(--border);border-radius:16px 16px 0 0;box-shadow:0 -8px 40px rgba(0,0,0,.3);max-height:66vh;overflow-y:auto;transform:translateY(100%);transition:transform .28s cubic-bezier(.4,0,.2,1);padding:12px 15px calc(20px + env(safe-area-inset-bottom,0px));}
#panel.open{transform:translateY(0);}
.panel-handle{width:38px;height:4px;background:#cbd5e1;border-radius:2px;margin:0 auto 10px;}
.sel-name{font-size:1.1rem;font-weight:800;color:var(--ca-blue);}
.sel-meta{font-size:.75rem;color:var(--sub);margin:2px 0 4px;line-height:1.45;}
.mile-chip{display:inline-block;background:#ecfeff;color:var(--teal);font-weight:700;font-size:.72rem;padding:2px 8px;border-radius:10px;}
.plan-btn{padding:11px;background:var(--ca-blue);color:#fff;border:none;border-radius:var(--radius);font-size:.82rem;font-weight:700;cursor:pointer;}
.grp-label{font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;margin:12px 0 5px;}
.conn{border:1px solid var(--border);border-left:4px solid var(--border);border-radius:var(--radius);padding:8px 10px;margin-bottom:6px;cursor:pointer;}
.conn:hover{box-shadow:0 2px 8px rgba(0,0,0,.1);}
.conn.up{border-left-color:var(--up);} .conn.down{border-left-color:var(--down);} .conn.lake,.conn.oab{border-left-color:var(--teal);}
.seg-chip{display:inline-block;font-weight:700;font-size:.72rem;padding:3px 9px;border-radius:10px;}
.seg-chip.lake{background:#ecfeff;color:var(--teal);border:1px solid #a5f3fc;}
.conn-name{font-size:.85rem;font-weight:700;}
.conn-stats{font-size:.72rem;color:var(--sub);margin-top:3px;display:flex;flex-wrap:wrap;gap:4px 12px;}
.conn-stats b{color:var(--text);} .drive{color:var(--sub);}
.close-x{background:none;border:none;font-size:1.2rem;color:#94a3b8;cursor:pointer;float:right;line-height:1;}
.note{font-size:.66rem;color:#94a3b8;line-height:1.4;margin-top:12px;border-top:1px solid #f1f5f9;padding-top:8px;}
.trip-row{display:flex;align-items:center;gap:8px;font-size:.85rem;margin:3px 0;}
.pin{width:14px;height:14px;border-radius:50%;flex-shrink:0;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.15);}
.stat-grid{display:flex;gap:7px;margin:9px 0;flex-wrap:wrap;}
.stat{flex:1;min-width:80px;background:var(--bg);border:1px solid var(--border);border-radius:7px;padding:7px 9px;text-align:center;}
.stat .n{font-size:1.05rem;font-weight:800;color:var(--ca-blue);line-height:1.1;}
.stat .l{font-size:.62rem;color:var(--sub);margin-top:2px;}
.time-btn{padding:7px 10px;border:1px solid var(--border);border-radius:6px;background:#fff;font-size:.74rem;font-weight:600;color:var(--sub);cursor:pointer;}
.time-btn.on{background:var(--ca-blue);color:#fff;border-color:var(--ca-blue);}
input[type=datetime-local]{width:100%;padding:7px 9px;border:1px solid var(--border);border-radius:6px;font-size:.85rem;margin-top:6px;font-family:inherit;}
.wq{font-size:.72rem;color:#475569;line-height:1.5;background:#f8fafc;border-left:3px solid var(--teal);border-radius:0 5px 5px 0;padding:7px 9px;margin-top:8px;}
.wq b{color:#334155;}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:9px 15px;border-radius:20px;font-size:.8rem;z-index:2000;box-shadow:0 4px 16px rgba(0,0,0,.35);opacity:0;transition:opacity .2s;pointer-events:none;}
.toast.show{opacity:1;}
#flow-chip{display:none;position:absolute;top:10px;left:10px;z-index:610;background:rgba(255,255,255,.95);border:1px solid var(--border);border-radius:10px;padding:7px 10px;font-size:.72rem;box-shadow:0 2px 10px rgba(0,0,0,.18);max-width:180px;}
#plan-chip{display:none;position:absolute;left:50%;bottom:calc(72px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:620;background:rgba(15,23,42,.92);color:#fff;border-radius:12px;padding:9px 14px;font-size:.78rem;box-shadow:0 4px 18px rgba(0,0,0,.4);cursor:pointer;max-width:92vw;line-height:1.45;}
#plan-chip .pc-open{display:inline-block;margin-left:8px;font-size:.66rem;background:rgba(255,255,255,.22);border-radius:10px;padding:1px 7px;}
.leaflet-container{background:#e8edf2;}
/* Floating "inspect map" toggle — phones only; keeps a way to peek at the map and,
   with the full-view panel, keeps every panel button reachable. */
#peek-btn{display:none;position:absolute;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:720;background:rgba(15,23,42,.94);color:#fff;border:none;border-radius:22px;padding:12px 22px;font-size:.85rem;font-weight:700;cursor:pointer;box-shadow:0 5px 20px rgba(0,0,0,.45);}
@media (max-width:768px){
  /* Panel becomes a translucent full-view overlay so the map shows faintly behind
     and all controls are on-screen (was a short bottom sheet clipped by browser chrome). */
  #panel{top:0;max-height:none;border-radius:0;background:rgba(255,255,255,.93);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);padding:calc(14px + env(safe-area-inset-top,0px)) 15px calc(80px + env(safe-area-inset-bottom,0px));}
  .panel-handle{display:none;}
  #plan-chip{display:none !important;}                 /* replaced by #peek-btn on phones */
  body.has-context .fabs{display:none;}                /* hide Near Me while a panel is up */
  body.has-context #peek-btn{display:block;}
}
</style>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
<header>
  <div class="hdr-title">🛶 Float &amp; Shuttle Planner<small>American · Sacramento · Feather rivers</small></div>
  <a class="hdr-link" href="index.html">Can I Swim Here? ↗</a>
</header>
<div class="app-body">
  <div id="map"></div>
  <div class="map-hint" id="hint">👆 Tap an access point — or 📍 Near Me — to plan a trip</div>
  <div id="flow-chip"></div>
  <div id="plan-chip" onclick="expandTrip()"></div>
  <div class="fabs"><button id="locate" onclick="locateMe()">📍 Near Me</button></div>
  <button id="peek-btn" onclick="peekMap()">⌄ Inspect map</button>
  <div id="panel"><div class="panel-handle"></div><div id="panel-body"></div></div>
</div>
<div class="toast" id="toast"></div>
<script>
const M2MI=1/1609.344;
let ACCESS=[], SPEED={min:2,max:4}, RIVER='Lower American River', LINE=[];
let STATIONS=[], BLOOMS=[], HAZARDS=[], PFD=[];
let markers=[], selIdx=null, userMarker=null, driveCache={}, _mode=null;
let routeLayer=L.layerGroup(), safetyLayer=L.layerGroup();
let plan=null; // {putIn, takeOut, timeMode, timeISO}

const map=L.map('map',{zoomControl:false}).setView([38.60,-121.36],11);
L.control.zoom({position:'topright'}).addTo(map);
const baseTopo=L.tileLayer('https://basemap.nationalmap.gov/arcgis/rest/services/USGSTopo/MapServer/tile/{z}/{y}/{x}',
  {attribution:'USGS National Map | River miles: OpenStreetMap | Water quality: CA Water Boards',opacity:0.6,maxZoom:19,maxNativeZoom:16,minZoom:9});
const baseSat=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
  {attribution:'Esri, Maxar, Earthstar Geographics | River miles: OpenStreetMap | Water quality: CA Water Boards',maxZoom:19,maxNativeZoom:19,minZoom:9});
let curBase='topo'; baseTopo.addTo(map);
const BaseToggle=L.Control.extend({options:{position:'topright'},onAdd:function(){
  const c=L.DomUtil.create('div','leaflet-bar'), a=L.DomUtil.create('a','',c);
  a.href='#'; a.role='button';
  a.style.cssText='width:auto;padding:0 9px;font:700 12px/30px system-ui,-apple-system,sans-serif;text-decoration:none;white-space:nowrap;color:#0f172a;';
  const setLabel=()=>{ a.innerHTML=curBase==='topo'?'🛰️ Satellite':'🗺️ Topo';
    a.title=curBase==='topo'?'Switch to satellite imagery':'Switch to topographic map'; };
  setLabel(); L.DomEvent.disableClickPropagation(c);
  L.DomEvent.on(a,'click',L.DomEvent.stop).on(a,'click',()=>{
    if(curBase==='topo'){ map.removeLayer(baseTopo); baseSat.addTo(map); baseSat.bringToBack(); curBase='sat'; }
    else { map.removeLayer(baseSat); baseTopo.addTo(map); baseTopo.bringToBack(); curBase='topo'; }
    setLabel();
  });
  return c;
}});
map.addControl(new BaseToggle());
routeLayer.addTo(map); safetyLayer.addTo(map);

// ── helpers ──────────────────────────────────────────────────────────────────
function distKm(a,b,c,d){const R=6371,dLa=(c-a)*Math.PI/180,dLo=(d-b)*Math.PI/180;const x=Math.sin(dLa/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dLo/2)**2;return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));}
function fmtDur(h){return h<1?Math.round(h*60)+' min':(Math.round(h*10)/10)+' hr';}
function fmtHrs(mi){return fmtDur(mi/SPEED.max)+'–'+fmtDur(mi/SPEED.min);}   // lakes / fallback (2–4 mph paddle)
function floatHours(mi){return mi/3;}                                        // fallback midpoint ~3 mph

// ── Discharge-based float velocity (continuity: V = Q ÷ A) ─────────────────────
// A river's mean velocity = discharge ÷ cross-sectional area. Area = channel width ×
// mean depth, and mean depth grows with flow via at-a-station hydraulic geometry
// (D ∝ Q^0.4). The THALWEG (deep center) runs faster than the cross-sectional mean;
// the banks run slower. Width/reference-depth are ESTIMATES — tune per reach.
const REACH_HYDRO = {
  'river':            {w:170, dRef:4.0, qRef:3000},    // Lower American River
  'sacramento-river': {w:450, dRef:18,  qRef:18000},   // Sacramento (wide, leveed)
  'feather-river':    {w:230, dRef:8.0, qRef:3500},    // Feather
};
const THALWEG_K = 1.4;          // thalweg (deep center) surface velocity ÷ cross-sectional mean
const EDGE_K = 0.55;            // near-bank velocity ÷ mean
const FPS_MPH = 0.681818;       // 1 ft/s = 0.6818 mph
function reachHydroFor(zone){
  if(zone==='lar') return REACH_HYDRO['river'];
  if(zone==='feather') return REACH_HYDRO['feather-river'];
  if(zone&&zone.indexOf('sac')===0) return REACH_HYDRO['sacramento-river'];
  return null;
}
function zoneVelocity(zone){    // {mean, thalweg, edge} mph + depth/area, from live discharge
  const h=reachHydroFor(zone), f=FLOWS[zone];
  if(!h||!f||f.cfs==null) return null;
  const Q=f.cfs, D=h.dRef*Math.pow(Q/h.qRef,0.4), A=h.w*D;
  const mean=(Q/A)*FPS_MPH;
  return {mean, thalweg:mean*THALWEG_K, edge:mean*EDGE_K, cfs:Q, depth:D, area:A, width:h.w};
}
// Trip velocity = average of the endpoints' reach velocities (a cross-reach float
// blends the two). Lakes/no-data → null (fall back to the 2–4 mph paddle estimate).
function tripVelocity(a,b){
  if(!a||!b||isLake(a)||isLake(b)) return null;
  const vs=[zoneVelocity(flowZone(a)),zoneVelocity(flowZone(b))].filter(Boolean);
  if(!vs.length) return null;
  const avg=k=>vs.reduce((s,v)=>s+v[k],0)/vs.length;
  return {mean:avg('mean'), thalweg:avg('thalweg'), edge:avg('edge')};
}
// Float-time range for a leg. Downstream float rides the current (thalweg = fast,
// mean = typical). Out-and-back / lake / unknown flow → paddle-effort estimate.
function legHrs(mi, vel){ return vel ? fmtDur(mi/vel.thalweg)+'–'+fmtDur(mi/vel.mean) : fmtHrs(mi); }
function legMidHrs(mi, vel){ return vel ? mi/vel.mean : floatHours(mi); }
function planVel(){ return plan && plan.kind==='oneway' ? tripVelocity(plan.putIn, plan.takeOut) : null; }
function fmtClock(d){return d.toLocaleString(undefined,{weekday:'short',hour:'numeric',minute:'2-digit'});}
function dismissHint(){const h=document.getElementById('hint');if(h)h.style.display='none';}
function byId(id){return ACCESS.find(a=>a.id===id);}
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2200);}
// Flowing reaches (american 'river', sacramento-river, feather-river) form a connected
// downstream NETWORK; lakes are flatwater above a dam (paddle, no shuttle).
const SEGLABEL={'river':'American River','sacramento-river':'Sacramento River','feather-river':'Feather River','lake-natoma':'Lake Natoma','folsom-lake':'Folsom Lake'};
const LAKE_SEGS=new Set(['lake-natoma','folsom-lake']);
function isLake(a){return a&&LAKE_SEGS.has(a.segment);}
function segLabel(a){return SEGLABEL[a&&a.segment]||(REACHES[a&&a.segment]&&REACHES[a.segment].name)||'River';}
// ── river NETWORK (downstream tree): American & Feather flow into the Sacramento ──
// Each point has river_mi (miles along its own reach) and flow_mi (miles to the system
// mouth, crossing confluences). REACHES{seg:{downstream,flow_offset,junction_mi,line}}.
let REACHES={};
function downstreamChain(seg){const c=[];let s=seg;while(s&&REACHES[s]){c.push(s);s=REACHES[s].downstream;}return c;}
function isDownstream(B,A){ // true if you can float DOWNSTREAM from A to B
  if(isLake(A)||isLake(B)||A.flow_mi==null||B.flow_mi==null||A===B) return false;
  const chain=downstreamChain(A.segment), bi=chain.indexOf(B.segment);
  if(bi<0) return false;
  if(bi===0) return B.river_mi < A.river_mi-1e-9;          // same reach, lower down
  const junctionFlow=REACHES[chain[bi-1]].flow_offset;      // where A's branch enters this reach
  return B.flow_mi <= junctionFlow+1e-6 && B.flow_mi < A.flow_mi-1e-9;
}
function onFlowPath(A,B){return isDownstream(A,B)||isDownstream(B,A);}  // one up/down line
function connType(A,B){
  if(isLake(A)&&isLake(B)) return A.segment===B.segment?'lake':'dam';
  if(isLake(A)||isLake(B)) return 'dam';
  return onFlowPath(A,B)?'flow':'branch';                   // rivers: same line vs different branch
}
function tripMiles(a,b){return (isLake(a)||isLake(b))?distKm(a.lat,a.lon,b.lat,b.lon)*0.621371:Math.abs(a.flow_mi-b.flow_mi);}
// Vertices from `hi` (upstream) down to `lo` (downstream), crossing reaches as needed.
function flowRoute(hi,lo){
  const chain=downstreamChain(hi.segment), li=chain.indexOf(lo.segment);
  let verts=[[hi.lat,hi.lon]];
  for(let k=0;k<=li;k++){
    const seg=chain[k], line=(REACHES[seg]&&REACHES[seg].line)||[];
    const topMi = k===0 ? hi.river_mi : REACHES[chain[k-1]].junction_mi;
    const botMi = seg===lo.segment ? lo.river_mi : 0;
    verts=verts.concat(line.filter(p=>p[2]>=botMi-0.05&&p[2]<=topMi+0.05).sort((a,b)=>b[2]-a[2]).map(p=>[p[0],p[1]]));
  }
  verts.push([lo.lat,lo.lon]);
  return verts;
}

// ── access markers / browse ───────────────────────────────────────────────────
function accessIcon(sel,lake){const c=sel?'#FDB913':(lake?'#4f46e5':'#0e7490'),sz=sel?30:22;return L.divIcon({className:'',iconSize:[sz,sz],iconAnchor:[sz/2,sz/2],html:`<div style="width:${sz}px;height:${sz}px;border-radius:50%;background:#fff;border:3px solid ${c};box-shadow:0 1px 5px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;font-size:${sel?15:11}px;">🛶</div>`});}
function drawMarkers(){markers.forEach(m=>m.remove());markers=[];ACCESS.forEach((a,i)=>{const mk=L.marker([a.lat,a.lon],{icon:accessIcon(i===selIdx,isLake(a)),zIndexOffset:i===selIdx?1000:200}).addTo(map).on('click',()=>selectAccess(i));mk.bindTooltip(a.name+(isLake(a)?' · '+segLabel(a):''),{direction:'top',offset:[0,-12]});markers.push(mk);});}
function nearestAccess(lat,lon){let bi=0,bd=1e9;ACCESS.forEach((a,i)=>{const d=distKm(lat,lon,a.lat,a.lon);if(d<bd){bd=d;bi=i;}});return bi;}

function selectAccess(i){
  clearTrip(); selIdx=i; _mode=null; drawMarkers(); dismissHint();
  const a=ACCESS[i]; map.setView([a.lat,a.lon],Math.max(map.getZoom(),12));
  const lake=isLake(a);
  const chip = lake
    ? `<div class="seg-chip lake">🛶 ${segLabel(a)} — flatwater (no current)</div>`
    : `<div><span class="mile-chip">river mile ${a.river_mi.toFixed(1)}</span></div>`;
  const btn=(k,label,sub,color)=>`<button class="plan-btn" id="btn-${k}" onclick="showConnections('${k}')" style="flex:1;background:${color};padding:7px 4px;">${label}<span style="display:block;font-weight:400;font-size:.58rem;opacity:.92;margin-top:1px;">${sub}</span></button>`;
  document.getElementById('panel-body').innerHTML=`
    <button class="close-x" onclick="closePanel()" aria-label="Close">✕</button>
    <div class="sel-name">🛶 ${a.name}</div>
    <div class="sel-meta">${a.note||''}</div>
    ${chip}
    <div style="font-size:.72rem;color:var(--sub);margin-top:9px;">How do you want to plan from here?</div>
    <div style="display:flex;gap:6px;margin-top:5px;">
      ${btn('from','🛶 From here','float / paddle out ⬇','var(--down)')}
      ${btn('to','🛶 To here','⬆ come in to here','var(--up)')}
      ${btn('oab','🔁 No shuttle','out &amp; back','var(--teal)')}
    </div>
    <div id="shuttles"></div>`;
  document.getElementById('panel').classList.add('open');
  syncPeek(); renderFlowChip();
  // Lakes default to the typical mode (out-and-back paddle); rivers wait for the user's pick.
  if(lake) showConnections('oab');
}
function closePanel(){document.getElementById('panel').classList.remove('open');document.getElementById('plan-chip').style.display='none';selIdx=null;_mode=null;clearTrip();drawSafety();drawMarkers();syncPeek();renderFlowChip();}
// Floating "inspect map" toggle (phones): collapse the full-view panel to see the map, tap to reopen.
function syncPeek(){
  const active=(selIdx!=null)||!!plan;
  document.body.classList.toggle('has-context',active);
  const btn=document.getElementById('peek-btn'); if(!btn) return;
  const open=document.getElementById('panel').classList.contains('open');
  btn.textContent = open ? '⌄ Inspect map' : (plan ? '▲ Back to plan' : '▲ Back to options');
}
function peekMap(){
  const p=document.getElementById('panel');
  if(p.classList.contains('open')){ p.classList.remove('open'); }
  else { document.getElementById('plan-chip').style.display='none'; p.classList.add('open'); }
  syncPeek();
}

// Every location offers three modes. Only HYDROLOGICALLY CONNECTED spots are listed:
// on a lake, the same lake; on a river, spots reachable along one up/down flow line
// (crossing confluences within the American↔Sacramento↔Feather network). A dam removes
// connectivity. 'from'/'to' = one-way; 'oab' = out-and-back (no shuttle).
function showConnections(mode){
  _mode=mode;
  const a=ACCESS[selIdx], lake=isLake(a);
  ['from','to','oab'].forEach(k=>{const b=document.getElementById('btn-'+k); if(b) b.style.opacity=(k===mode?'1':'.5');});
  let list;
  if(lake){
    list=ACCESS.map((x,i)=>({x,i})).filter(o=>o.i!==selIdx && o.x.segment===a.segment)
      .map(o=>({...o,mi:distKm(a.lat,a.lon,o.x.lat,o.x.lon)*0.621371})).sort((p,q)=>p.mi-q.mi);
  } else {
    list=ACCESS.map((x,i)=>({x,i})).filter(o=>{
      if(o.i===selIdx||isLake(o.x)) return false;
      return mode==='from'?isDownstream(o.x,a):mode==='to'?isDownstream(a,o.x):onFlowPath(a,o.x);
    }).map(o=>({...o,mi:Math.abs(o.x.flow_mi-a.flow_mi)})).sort((p,q)=>p.mi-q.mi);
  }
  const hdr = mode==='from'?`⬇ Float FROM ${a.name}`:mode==='to'?`⬆ Float TO ${a.name}`:`🔁 Out-and-back from ${a.name}`;
  const hdrC = mode==='from'?'var(--down)':mode==='to'?'var(--up)':'var(--teal)';
  let html=`<div class="grp-label" style="color:${hdrC}">${hdr}</div>`, drives=[];
  if(mode==='oab'){
    html+=`<div class="conn oab" onclick="buildTrip(${selIdx},${selIdx},'oab')">
      <div class="conn-name">📍 Just meet &amp; paddle here</div>
      <div class="conn-stats"><span>out-and-back from ${a.name}</span><span class="drive">🚫 no shuttle</span></div>
    </div>`;
  }
  if(list.length){
    html+=list.map(o=>{
      const put = mode==='to'?o.i:selIdx, take = mode==='to'?selIdx:o.i, kind = mode==='oab'?'oab':'oneway';
      const vel = kind==='oneway' ? tripVelocity(a,o.x) : null;   // downstream float rides the current
      const stat = kind==='oab'
        ? `<span>🛶 <b>${(o.mi*2).toFixed(1)} mi</b> round trip · ${fmtHrs(o.mi*2)}</span><span class="drive">🚫 no shuttle</span>`
        : `<span>🛶 <b>${o.mi.toFixed(1)} mi</b> ${lake?'paddle':'float'} · ${legHrs(o.mi,vel)}</span><span class="drive" id="drv_${o.i}">🚗 shuttle…</span>`;
      if(kind==='oneway') drives.push(o);
      const cls=mode==='from'?'down':mode==='to'?'up':'oab', arr=mode==='from'?'⬇':mode==='to'?'⬆':'🔁';
      const xreach = o.x.segment!==a.segment ? ` <span style="color:#94a3b8;font-weight:400;">· ${segLabel(o.x)}</span>` : '';
      return `<div class="conn ${cls}" onclick="buildTrip(${put},${take},'${kind}')">
        <div class="conn-name">${arr} ${o.x.name}${xreach}</div>
        <div class="conn-stats">${stat}</div>
      </div>`;
    }).join('');
  } else if(mode!=='oab'){
    html+=`<div class="note" style="border:0;padding:6px 0;">${lake?'No other mapped spot on this water yet.':(mode==='from'?'This is the downstream end of the mapped network — try <b>to here</b> or <b>no shuttle</b>.':'This is the uppermost mapped access — try <b>from here</b> or <b>no shuttle</b>.')}</div>`;
  }
  html+=`<div class="note">${mode==='oab'
    ? `Out-and-back = paddle out and return to the same spot, <b>no shuttle needed</b>. Round-trip distance shown${!lake?'; on a flowing river head upstream first, then float back':''}.`
    : `One-way. ${lake?'No current — arrange a pickup or your own shuttle. Paddle ~'+SPEED.min+'–'+SPEED.max+' mph.':'Shuttle drive (take-out → put-in) shown — or arrange your own. Float time is discharge-based (thalweg→mean).'}`} ${lake?`Only spots on <b>${segLabel(a)}</b> are shown`:'Connected spots (across confluences) are shown'} — dams block connections.</div>`;
  document.getElementById('shuttles').innerHTML=html;
  drives.forEach(o=>fetchDrive(a,o.x,'drv_'+o.i));
}

// ── shuttle drive time (OSRM, with estimate fallback) ──────────────────────────
// Cars go to the parking lot, not the water's edge — route lot-to-lot when available.
function driveCoord(a){ return (a.parking_lat!=null&&a.parking_lon!=null)?[a.parking_lat,a.parking_lon]:[a.lat,a.lon]; }
function fetchDrive(a,b,elId,cb){
  const A=driveCoord(a), B=driveCoord(b);
  const key=[A[0],A[1],B[0],B[1]].map(v=>v.toFixed(4)).join(',');
  const set=t=>{const el=elId&&document.getElementById(elId);if(el)el.innerHTML='🚗 '+t; if(cb)cb(t);};
  if(driveCache[key]){set(driveCache[key]);return;}
  fetch(`https://router.project-osrm.org/route/v1/driving/${A[1]},${A[0]};${B[1]},${B[0]}?overview=false`)
   .then(r=>r.json()).then(j=>{if(j&&j.routes&&j.routes[0]){const rt=j.routes[0];const t=`<b>${Math.round(rt.duration/60)} min</b> drive · ${(rt.distance*M2MI).toFixed(1)} mi`;driveCache[key]=t;set(t);}else throw 0;})
   .catch(()=>{const mi=distKm(A[0],A[1],B[0],B[1])*0.621371*1.4;const t=`~${Math.round(mi/32*60)} min drive (est.)`;driveCache[key]=t;set(t);});
}
// Google Maps driving directions from take-out parking to put-in parking (the shuttle).
function gdir(from,to){ const A=driveCoord(from),B=driveCoord(to); return `https://www.google.com/maps/dir/?api=1&origin=${A[0]},${A[1]}&destination=${B[0]},${B[1]}&travelmode=driving`; }

// ── build & draw a trip (put-in upstream, take-out downstream) ─────────────────
function clearTrip(){routeLayer.clearLayers();safetyLayer.clearLayers();plan=null;}
function buildTrip(aIdx,bIdx,kind,timeMode,timeISO){
  kind = kind==='oab'?'oab':'oneway';
  const A=ACCESS[aIdx], B=ACCESS[bIdx], samePoint=aIdx===bIdx;
  if(!samePoint){
    const ct=connType(A,B);
    if(ct==='dam'||ct==='branch'){
      const msg = ct==='dam'
        ? `🚫 ${A.name} and ${B.name} are on different waters (${segLabel(A)} vs ${segLabel(B)}), separated by a dam — no through route.`
        : `↔ ${A.name} (${segLabel(A)}) and ${B.name} (${segLabel(B)}) are on different branches of the network — you'd float down one and paddle up the other. Plan each river as its own leg.`;
      const sh=document.getElementById('shuttles');
      if(sh) sh.innerHTML=`<div class="note" style="border-left:3px solid #b91c1c;padding-left:8px;">${msg}</div>`;
      else toast(ct==='dam'?'🚫 Separated by a dam.':'↔ Different branches — plan each leg.');
      return;
    }
  }
  const lake=isLake(A)||isLake(B);
  // put-in = upstream (higher flow_mi); take-out = downstream. Lakes have no flow direction.
  let putIn,takeOut,routeV,oneWayMi;
  if(samePoint){ putIn=A; takeOut=A; oneWayMi=0; routeV=[[A.lat,A.lon]]; }
  else if(lake){ putIn=A; takeOut=B; oneWayMi=distKm(A.lat,A.lon,B.lat,B.lon)*0.621371; routeV=[[A.lat,A.lon],[B.lat,B.lon]]; }
  else {
    const hi = A.flow_mi>=B.flow_mi?A:B, lo = A.flow_mi>=B.flow_mi?B:A;
    oneWayMi = hi.flow_mi-lo.flow_mi; routeV = flowRoute(hi,lo);
    if(kind==='oab'){ putIn=A; takeOut=B; } else { putIn=hi; takeOut=lo; }
  }
  const miles=kind==='oab'?oneWayMi*2:oneWayMi;   // out-and-back = round trip
  plan={putIn,takeOut,kind,lake,samePoint,oneWayMi,miles,routeV,segment:putIn.segment,timeMode:timeMode||null,timeISO:timeISO||null};
  selIdx=null; drawMarkers(); routeLayer.clearLayers();
  if(!samePoint){
    L.polyline(routeV,{color:'#0891b2',weight:6,opacity:.85,dashArray:(lake||kind==='oab')?'10,8':null}).addTo(routeLayer);
    L.polyline(routeV,{color:'#fff',weight:2,opacity:.6,dashArray:'2,10'}).addTo(routeLayer);
  }
  addParkingWalk(putIn); if(!samePoint) addParkingWalk(takeOut);
  if(kind==='oab'){
    routeLayer.addLayer(endMarker(putIn, samePoint?'MEET & PADDLE':'START / FINISH','#15803D'));
    if(!samePoint) routeLayer.addLayer(endMarker(takeOut,'TURNAROUND','#0e7490'));
  } else {
    routeLayer.addLayer(endMarker(putIn,'PUT IN','#15803D'));
    routeLayer.addLayer(endMarker(takeOut,'TAKE OUT','#B91C1C'));
  }
  const base=samePoint?[[putIn.lat,putIn.lon]]:[[putIn.lat,putIn.lon],[takeOut.lat,takeOut.lon]];
  const allpts=base.concat([putIn,takeOut].filter(x=>x.parking_lat!=null).map(x=>[x.parking_lat,x.parking_lon]));
  map.fitBounds(L.latLngBounds(allpts).pad(samePoint?0.5:0.25));
  drawSafety();
  renderTripPanel();
  document.getElementById('panel').classList.add('open');
  syncPeek(); renderFlowChip();
  dismissHint();
}
function gmaps(lat,lon){ return `https://www.google.com/maps/search/?api=1&query=${lat},${lon}`; }
function gmapLink(lat,lon,label){ return `<a href="${gmaps(lat,lon)}" target="_blank" rel="noopener" style="color:var(--ca-blue);font-weight:700;text-decoration:none;">${label} ↗</a>`; }
function endMarker(a,label,color){
  return L.marker([a.lat,a.lon],{zIndexOffset:1500,icon:L.divIcon({className:'',iconSize:[16,16],iconAnchor:[8,8],
    html:`<div style="width:16px;height:16px;border-radius:50%;background:${color};border:3px solid #fff;box-shadow:0 0 0 2px ${color}55;"></div>`})})
    .bindTooltip(`${label}: ${a.name}`,{permanent:true,direction:'top',offset:[0,-8],className:'route-tt'})
    .bindPopup(`<b>${label}</b>: ${a.name}<br>${gmapLink(a.lat,a.lon,"Open in Google Maps")}`);
}
// Parking marker + dashed walk line from the lot to the water's edge.
function addParkingWalk(a){
  if(a.parking_lat==null||a.parking_lon==null) return;
  L.polyline([[a.parking_lat,a.parking_lon],[a.lat,a.lon]],{color:'#334155',weight:2.5,opacity:.8,dashArray:'4,5'}).addTo(routeLayer);
  L.marker([a.parking_lat,a.parking_lon],{zIndexOffset:1400,icon:L.divIcon({className:'',iconSize:[22,22],iconAnchor:[11,11],
    html:`<div style="width:22px;height:22px;border-radius:5px;background:#1d4ed8;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:13px;">P</div>`})})
    .addTo(routeLayer)
    .bindTooltip(`🅿️ Parking: ${a.name}${walkText(a)?` · ${walkText(a)} to water`:''}`,{direction:'top'})
    .bindPopup(`🅿️ <b>Parking</b>: ${a.name}${a.parking_fee?`<br>${a.parking_fee}`:''}${walkText(a)?`<br>🚶 ${walkText(a)} to water`:''}<br>${gmapLink(a.parking_lat,a.parking_lon,"Directions in Google Maps")}`);
}
function walkText(a){
  if(a.walk_to_water) return a.walk_to_water;
  if(a.walk_ft) return a.walk_ft>=500?`${(a.walk_ft/5280).toFixed(1)} mi walk`:`${a.walk_ft} ft walk`;
  return '';
}
function accDetail(a){
  const bits=[];
  const hasPark=a.parking_lat!=null&&a.parking_lon!=null;
  if(hasPark) bits.push(`${gmapLink(a.parking_lat,a.parking_lon,"🅿️ Parking")}${a.parking_fee?` — ${a.parking_fee}`:''}`);
  else if(a.parking_fee) bits.push(`🅿️ ${a.parking_fee}`);
  if(walkText(a)) bits.push(`🚶 ${walkText(a)}`);
  if(a.amenities) bits.push(a.amenities);
  let h=bits.length?`<div style="font-size:.68rem;color:#64748b;margin:1px 0 2px 22px;line-height:1.4;">${bits.join(' · ')}</div>`:'';
  if(a.parking_info) h+=`<div style="font-size:.64rem;color:#94a3b8;margin:0 0 2px 22px;line-height:1.4;">${a.parking_info}</div>`;
  if(a.cautions) h+=`<div style="font-size:.66rem;color:#b91c1c;font-weight:600;margin:1px 0 3px 22px;line-height:1.4;">⚠️ ${a.cautions}</div>`;
  return h;
}

// ── water quality (Can I Swim Here?) along the route ───────────────────────────
function stationRisk(st){
  const res=(st.samples||[]).map(s=>s.result).filter(v=>v>0),n=res.length;
  if(!n||!st.latest) return {key:'Unknown'};
  const age=(Date.now()-new Date(st.latest.date).getTime())/86400000;
  const gm=Math.exp(res.map(v=>Math.log(v)).reduce((a,b)=>a+b,0)/n);
  const pAdv=res.filter(v=>v>235).length/n,pStv=res.filter(v=>v>410).length/n;
  let key;
  if(age<=14) key=st.latest.result<=126?'Good':st.latest.result<=235?'Caution':st.latest.result<=410?'Warning':'Unsafe';
  else if(n<4) key='Unknown';
  else if(gm>235||pAdv>=.5||pStv>=.33) key='Unsafe';
  else if(gm>126||pAdv>=.2||pStv>=.12) key='Caution';
  else key='Good';
  return {key,gm:Math.round(gm),n};
}
const RISKC={Good:'#15803D',Caution:'#A16207',Warning:'#C2410C',Unsafe:'#B91C1C',Unknown:'#6B7280'};
const RISKL={Good:'Probably safe',Caution:'Uncertain',Warning:'Elevated',Unsafe:'Probably unsafe',Unknown:'Unknown'};
function near(items,latf,lonf,mi){return items.filter(x=>x.lat!=null&&distKm(x.lat,x.lon,latf,lonf)<=mi/0.621371);}
function corridor(items){ if(!plan)return items; return items.filter(x=>x.lat!=null&&(distToRoute(x.lat,x.lon)<=2.0)); }
// Distance (mi) from a point to the drawn route polyline (works across reaches).
function segDistMi(lat,lon,A,B){ const kx=Math.cos(lat*Math.PI/180);
  const ax=A[1]*kx,ay=A[0],bx=B[1]*kx,by=B[0],px=lon*kx,py=lat,dx=bx-ax,dy=by-ay,L2=dx*dx+dy*dy;
  let t=L2?((px-ax)*dx+(py-ay)*dy)/L2:0; t=Math.max(0,Math.min(1,t));
  return distKm(lat,lon,ay+t*dy,(ax+t*dx)/kx)*0.621371; }
function distToRoute(lat,lon){ if(!plan||!plan.routeV)return 1e9; const V=plan.routeV; let m=1e9;
  for(let i=0;i<V.length;i++){const d=distKm(lat,lon,V[i][0],V[i][1])*0.621371;if(d<m)m=d;}
  for(let i=0;i+1<V.length;i++){const d=segDistMi(lat,lon,V[i],V[i+1]);if(d<m)m=d;}
  return m; }
function drawSafety(){
  safetyLayer.clearLayers();
  // Drowning hazards: always shown (from Can I Swim Here?) so the map is useful to inspect.
  HAZARDS.forEach(h=>{if(h.lat==null)return;L.marker([h.lat,h.lon],{zIndexOffset:400,icon:L.divIcon({className:'',iconSize:[16,16],iconAnchor:[8,8],html:'<div style="width:12px;height:12px;transform:rotate(45deg);background:#7f1d1d;border:2px solid #fff;margin:2px;"></div>'})}).addTo(safetyLayer)
      .bindTooltip(`⚠️ Drowning hazard: ${h.name}`,{direction:'top'});});
  if(!plan) return;
  // Water quality along the trip corridor.
  corridor(STATIONS).forEach(st=>{const r=stationRisk(st);const c=RISKC[r.key];
    L.circleMarker([st.lat,st.lon],{radius:6,fillColor:c,fillOpacity:.9,color:'#fff',weight:2}).addTo(safetyLayer)
      .bindTooltip(`💧 ${st.name}: ${RISKL[r.key]}${r.gm?` (geomean ${r.gm})`:''}`,{direction:'top'});});
  corridor(BLOOMS).filter(b=>b.tier&&b.tier!=='Other').forEach(b=>{
    L.marker([b.lat,b.lon],{zIndexOffset:400,icon:L.divIcon({className:'',iconSize:[16,16],iconAnchor:[8,8],html:'<div style="font-size:14px;line-height:1;">🦠</div>'})}).addTo(safetyLayer)
      .bindTooltip(`🦠 Algal bloom: ${b.name||''} (${(b.obs||'').slice(0,10)})`,{direction:'top'});});
}

// ── live river flow — reach-aware. LAR = USGS Fair Oaks (has calm/swift/high
//    categories); Sacramento & Feather = NOAA NWPS gages (big rivers, flow shown
//    without the LAR hazard categories). The chip shows the gage for the selected
//    access point / trip put-in; default (splash) = Lower American River. ──
const GAGES = {
  lar:       {src:'usgs', id:'11446500', river:'Lower American River', site:'USGS Fair Oaks', cat:true},
  sac_below: {src:'nwps', id:'SACC1',    river:'Sacramento River',     site:'NWPS · I St (below confluence)'},
  sac_mid:   {src:'nwps', id:'VONC1',    river:'Sacramento River',     site:'NWPS · Verona'},
  sac_above: {src:'nwps', id:'FMWC1',    river:'Sacramento River',     site:'NWPS · Fremont Weir'},
  feather:   {src:'nwps', id:'NCOC1',    river:'Feather River',        site:'NWPS · Nicolaus'},
};
let FLOWS={};   // zone -> {cfs, gageFt, time}
let TEMPS={};   // 'lar' | 'sac' -> {c, src}  (live water temperature, where a gage reports it)
function flowCat(cfs){
  if(cfs==null) return {label:'—',color:'#374151'};
  if(cfs<1500) return {label:'Low / calm',color:'#15803D'};
  if(cfs<3500) return {label:'Moderate',color:'#A16207'};
  if(cfs<6000) return {label:'Swift',color:'#C2410C'};
  return {label:'High',color:'#B91C1C'};
}
function usgsTemp(site, key, src){   // fetch live water temperature (00010, °C) from a USGS gage
  fetch(`https://waterservices.usgs.gov/nwis/iv/?sites=${site}&parameterCd=00010&period=P1D&format=json&siteStatus=all`)
   .then(r=>r.json()).then(j=>{
     const ts=(j&&j.value&&j.value.timeSeries)||[]; if(!ts[0]||!ts[0].values[0])return;
     const v=ts[0].values[0].value.map(x=>parseFloat(x.value)).filter(x=>!isNaN(x)&&x>-999);
     if(v.length){ TEMPS[key]={c:v[v.length-1],src}; renderFlowChip(); }
   }).catch(()=>{});
}
function loadFlow(){
  // LAR — USGS instantaneous values (discharge + gage height + water temp)
  fetch('https://waterservices.usgs.gov/nwis/iv/?sites=11446500&parameterCd=00060,00065,00010&period=P2D&format=json&siteStatus=all')
   .then(r=>r.json()).then(j=>{
     const ts=(j&&j.value&&j.value.timeSeries)||[];
     const ser=code=>{const s=ts.find(x=>x.variable.variableCode[0].value===code);if(!s||!s.values[0])return[];return s.values[0].value.map(v=>({v:parseFloat(v.value),t:v.dateTime})).filter(p=>!isNaN(p.v)&&p.v>-999998);};
     const q=ser('00060'),g=ser('00065'),tp=ser('00010'); if(!q.length)return;
     FLOWS.lar={cfs:q[q.length-1].v,gageFt:g.length?g[g.length-1].v:null,time:q[q.length-1].t};
     if(tp.length) TEMPS.lar={c:tp[tp.length-1].v,src:'Fair Oaks'};
     refreshFlowUI();
   }).catch(()=>{});
  usgsTemp('11447650','sac','Freeport');   // Sacramento River water temp (Feather has no live temp gage)
  // Sacramento & Feather flow — NOAA NWPS observed (secondary = flow, kcfs)
  ['sac_below','sac_mid','sac_above','feather'].forEach(z=>{
    fetch('https://api.water.noaa.gov/nwps/v1/gauges/'+GAGES[z].id).then(r=>r.json()).then(d=>{
      const o=d&&d.status&&d.status.observed; if(!o||o.secondary==null)return;
      FLOWS[z]={cfs:(o.secondaryUnit==='kcfs'?o.secondary*1000:o.secondary),
                gageFt:o.primaryUnit==='ft'?o.primary:null, time:o.validTime};
      refreshFlowUI();
    }).catch(()=>{});
  });
}
function zoneTemp(z){ return z==='lar'?TEMPS.lar : (z&&z.indexOf('sac')===0)?TEMPS.sac : null; }
// Which flow gage applies to an access point (by reach + position).
function flowZone(a){
  if(!a||isLake(a)) return null;                          // lakes = reservoirs, no river flow
  if(a.segment==='river') return 'lar';
  if(a.segment==='feather-river') return 'feather';       // Feather above Verona
  if(a.segment==='sacramento-river'){
    const cm=(REACHES['river']&&REACHES['river'].junction_mi)||4.2;         // Sac mile at the American confluence
    const vm=(REACHES['feather-river']&&REACHES['feather-river'].junction_mi)||23.9;  // Sac mile at Verona
    if(a.river_mi<cm) return 'sac_below';                 // downstream of Discovery
    if(a.river_mi<vm) return 'sac_mid';                   // Discovery → Verona
    return 'sac_above';                                   // above Verona
  }
  return null;
}
function activeZone(){
  if(plan) return plan.lake?null:(flowZone(plan.putIn)||flowZone(plan.takeOut));
  if(selIdx!=null) return flowZone(ACCESS[selIdx]);
  return 'lar';                                           // splash / default
}
function renderFlowChip(){
  const el=document.getElementById('flow-chip'); if(!el)return;
  const z=activeZone();
  if(!z){ el.style.display='none'; return; }              // lake selected → no river flow
  const g=GAGES[z], f=FLOWS[z]; el.style.display='block';
  const head=`<div style="font-weight:800;color:var(--teal);font-size:.58rem;letter-spacing:.05em;text-transform:uppercase;">🌊 ${g.river}</div>`;
  if(!f){ el.innerHTML=head+`<div style="font-size:.58rem;color:#94a3b8;">loading ${g.site}…</div>`; return; }
  const c=g.cat?flowCat(f.cfs):null;
  const t=zoneTemp(z);
  const tempLine = t ? `<div style="font-size:.62rem;font-weight:700;color:#0e7490;margin-top:1px;">🌡 ${t.c.toFixed(1)} °C · ${Math.round(t.c*9/5+32)} °F</div>` : '';
  el.innerHTML=head+`<div style="display:flex;align-items:baseline;gap:4px;"><span style="font-size:1.05rem;font-weight:800;color:#0f172a;">${Math.round(f.cfs).toLocaleString()}</span><span style="font-size:.6rem;color:#64748b;">cfs</span>${c?`<span style="margin-left:auto;font-size:.58rem;font-weight:700;color:#fff;background:${c.color};padding:1px 6px;border-radius:9px;">${c.label}</span>`:''}</div>
    ${tempLine}
    <div style="font-size:.56rem;color:#94a3b8;">${f.gageFt!=null?'gage '+f.gageFt.toFixed(1)+' ft · ':''}${g.site}${t?' · temp '+t.src:''}</div>`;
}
// When live flow arrives, refresh the chip and re-render open times (unless the user is
// typing in the panel). Flow drives the discharge-based float velocities.
function refreshFlowUI(){
  renderFlowChip();
  const panel=document.getElementById('panel');
  if(document.activeElement && panel.contains(document.activeElement)) return;
  if(plan && panel.classList.contains('open')) renderTripPanel();
  else if(selIdx!=null && _mode) showConnections(_mode);
}

// ── minimize (inspect map) + shaded plan box ───────────────────────────────────
function minimizeTrip(){ document.getElementById('panel').classList.remove('open'); renderPlanChip(); syncPeek(); }
function expandTrip(){ document.getElementById('plan-chip').style.display='none'; if(plan){ renderTripPanel(); document.getElementById('panel').classList.add('open'); } syncPeek(); }
function renderPlanChip(){
  const chip=document.getElementById('plan-chip'); if(!plan){chip.style.display='none';return;}
  const mi=plan.miles, T=computeTimes(), oab=plan.kind==='oab';
  const title=plan.samePoint?`🛶 <b>${plan.putIn.name}</b> (meet & paddle)`
    :`🛶 <b>${plan.putIn.name}</b> ${oab?'⟳':'→'} <b>${plan.takeOut.name}</b>`;
  const stats=plan.samePoint?'out-and-back · 🚫 no shuttle'
    :`${mi.toFixed(1)} mi · ${legHrs(mi,planVel())} ${oab?'round-trip · 🚫 no shuttle':(plan.lake?'paddle':'float')}`;
  chip.innerHTML=`${title}<br>
    <span style="font-size:.7rem;opacity:.9;">${stats}${T?` · ${plan.samePoint?'meet':'put in'} ${fmtClock(T.start)}`:''}</span>
    <span class="pc-open">tap to open ▲</span>`;
  chip.style.display='block';
}
function wqSummary(a){ // nearest station risk for an access point
  if(!STATIONS.length) return '';
  let best=null,bd=1e9; STATIONS.forEach(st=>{if(st.lat==null)return;const d=distKm(a.lat,a.lon,st.lat,st.lon);if(d<bd){bd=d;best=st;}});
  if(!best||bd*0.621371>3) return '<span style="color:#6B7280">bacteria: unknown (no station within 3 mi)</span>';
  const r=stationRisk(best);return `bacteria: <b style="color:${RISKC[r.key]}">${RISKL[r.key]}</b> <span style="color:#94a3b8">(${best.name.replace('American River at ','').replace('Lake Natoma at ','').replace('Folsom Lake at ','')})</span>`;
}

// ── trip / plan panel ──────────────────────────────────────────────────────────
function computeTimes(){
  if(!plan||!plan.timeMode||!plan.timeISO) return null;
  const t=new Date(plan.timeISO); if(isNaN(t)) return null;
  if(plan.samePoint) return {start:t,end:t,hrs:0,meet:true};   // a meet spot has no fixed duration
  const hrs=legMidHrs(plan.miles, planVel());
  let start,end;
  if(plan.timeMode==='start'){start=t;end=new Date(t.getTime()+hrs*3600000);}
  else{end=t;start=new Date(t.getTime()-hrs*3600000);}
  return {start,end,hrs};
}
function renderTripPanel(){
  const {putIn,takeOut,lake,samePoint}=plan, oab=plan.kind==='oab', mi=plan.miles;
  const body=document.getElementById('panel-body');
  const T=computeTimes();
  const vel=planVel();                                   // discharge-based float velocity (rivers, one-way)
  const zv=vel?zoneVelocity(flowZone(putIn)):null;       // put-in reach detail for the "basis" line
  const milc=a=>a.river_mi!=null?` <span style="color:#94a3b8;font-size:.72rem;">· mi ${a.river_mi.toFixed(1)}</span>`:'';
  const title = samePoint?'Your meet-up paddle':oab?'Your out-and-back':(lake?'Your paddle':'Your float');
  const label1 = oab?'Meet / launch:':'Put in:';
  const label2 = oab?'Turnaround:':'Take out:';
  const shuttleStat = oab
    ? `<div class="stat"><div class="n" style="color:#0e7490;">🚫 None</div><div class="l">out &amp; back</div></div>`
    : `<a class="stat" href="${gdir(plan.takeOut,plan.putIn)}" target="_blank" rel="noopener" style="text-decoration:none;color:inherit;"><div class="n" id="trip-drive">…</div><div class="l">🚗 shuttle ↗ ${lake?'(self-run)':''}</div></a>`;
  const distStat = samePoint
    ? `<div class="stat"><div class="n">—</div><div class="l">your choice</div></div><div class="stat"><div class="n">🔁</div><div class="l">out &amp; back</div></div>`
    : `<div class="stat"><div class="n">${mi.toFixed(1)} mi</div><div class="l">${oab?'round trip':(lake?'paddle':'river dist')}</div></div>
       <div class="stat"><div class="n">${legHrs(mi,vel)}</div><div class="l">${lake?'paddle':(oab?'paddle':'float')} ${vel?'· thalweg ~'+vel.thalweg.toFixed(1)+' mph':'@ '+SPEED.min+'–'+SPEED.max+' mph'}</div></div>`;
  body.innerHTML=`
    <button class="close-x" onclick="closePanel()" aria-label="Close">✕</button>
    <div class="sel-name">🛶 ${title}</div>
    ${oab?`<div class="seg-chip lake" style="margin-bottom:7px;">🔁 Out-and-back · <b>no shuttle</b>${lake?' · '+segLabel(putIn):''}</div>`:(lake?`<div class="seg-chip lake" style="margin-bottom:7px;">🛶 ${segLabel(putIn)} — flatwater, one-way (arrange a pickup)</div>`:'')}
    <div class="trip-row"><span class="pin" style="background:#15803D"></span><b>${label1}</b>&nbsp;${gmapLink(putIn.lat,putIn.lon,putIn.name)}${milc(putIn)}</div>
    ${accDetail(putIn)}
    ${samePoint?'':`<div class="trip-row"><span class="pin" style="background:${oab?'#0e7490':'#B91C1C'}"></span><b>${label2}</b>&nbsp;${gmapLink(takeOut.lat,takeOut.lon,takeOut.name)}${milc(takeOut)}</div>${accDetail(takeOut)}`}
    <div class="stat-grid">
      ${distStat}
      ${shuttleStat}
    </div>
    ${vel?`<div style="font-size:.66rem;color:#334155;margin-top:7px;background:#f0f9ff;border-left:3px solid #0891b2;border-radius:0 5px 5px 0;padding:6px 9px;line-height:1.5;">
      🌊 <b>Speed from discharge</b> (V = Q ÷ A): <b>thalweg ~${vel.thalweg.toFixed(1)} mph</b> (fast center) · mid-channel ~${vel.mean.toFixed(1)} mph · near banks ~${vel.edge.toFixed(1)} mph. Float time = thalweg→mean.
      ${zv?`<span style="color:#64748b;">Basis: Q ${Math.round(zv.cfs).toLocaleString()} cfs ÷ est. ${Math.round(zv.width)} ft × ${zv.depth.toFixed(1)} ft ≈ ${Math.round(zv.area).toLocaleString()} ft².</span>`:''}
    </div>`:''}
    <div class="wq"><b>💧 Water quality ${samePoint?'here':'along your route'}</b> (Can I Swim Here?)<br>
      ${oab?(samePoint?'Spot':'Launch'):'Put-in'} ${wqSummary(putIn)}${samePoint?'':`<br>${oab?'Turnaround':'Take-out'} ${wqSummary(takeOut)}`}<br>
      <span style="font-size:.66rem;color:#94a3b8;">Dots = station risk (from history); 🦠 = bloom report; ◆ = drowning hazard. Tap markers for detail. Full detail in <a href="index.html">Can I Swim Here?</a></span>
    </div>
    ${samePoint?`<div style="font-size:.72rem;font-weight:700;color:#334155;margin-top:11px;">⏱ Set a meet time (optional)</div>
      <div style="display:flex;gap:6px;margin-top:5px;">
        <button class="time-btn ${plan.timeMode==='start'?'on':''}" onclick="setTimeMode('start')">Set meet time</button>
        ${plan.timeMode?`<button class="time-btn" onclick="setTimeMode(null)">clear</button>`:''}
      </div>
      ${plan.timeMode?`<input type="datetime-local" id="time-in" value="${plan.timeISO||''}" onchange="onTime(this.value)">`:''}
      ${T?`<div style="margin-top:7px;font-size:.8rem;color:#334155;background:#ecfeff;border-radius:6px;padding:8px 10px;">🟢 Meet at <b>${fmtClock(T.start)}</b> · ${putIn.name}</div>`:''}`
    :`<div style="font-size:.72rem;font-weight:700;color:#334155;margin-top:11px;">⏱ Set a time (optional)</div>
      <div style="display:flex;gap:6px;margin-top:5px;">
        <button class="time-btn ${plan.timeMode==='start'?'on':''}" onclick="setTimeMode('start')">Set start time</button>
        <button class="time-btn ${plan.timeMode==='end'?'on':''}" onclick="setTimeMode('end')">Set ${oab?'return':(lake?'arrival':'take-out')} time</button>
        ${plan.timeMode?`<button class="time-btn" onclick="setTimeMode(null)">clear</button>`:''}
      </div>
      ${plan.timeMode?`<input type="datetime-local" id="time-in" value="${plan.timeISO||''}" onchange="onTime(this.value)">`:''}
      ${T?`<div style="margin-top:7px;font-size:.8rem;color:#334155;background:#ecfeff;border-radius:6px;padding:8px 10px;">🟢 ${oab?'Launch':'Put in'} <b>${fmtClock(T.start)}</b> → 🔴 ${oab?'back by':'take out'} <b>${fmtClock(T.end)}</b><br><span style="font-size:.68rem;color:#64748b;">≈ ${(T.hrs).toFixed(1)} hr ${vel?'at ~'+vel.mean.toFixed(1)+' mph (mid-channel)':'at ~3 mph'} (range ${legHrs(mi,vel)})</span></div>`:''}`}
    <button class="plan-btn" style="width:100%;margin-top:12px;background:var(--ca-blue);" onclick="sharePlan()">🔗 Share this plan</button>
    <div style="display:flex;gap:7px;margin-top:7px;">
      <button class="time-btn" style="flex:1;text-align:center;" onclick="minimizeTrip()">⌄ Inspect map</button>
      <button class="time-btn" style="flex:1;text-align:center;" onclick="closePanel()">← New trip</button>
    </div>
    <div class="note">${oab
      ? `Out-and-back — return to your start, <b>no shuttle needed</b>.${lake?' Watch for wind and motorboats.':' On a flowing river, paddle upstream first then float back.'}`
      : (lake?`Flatwater one-way (${segLabel(putIn)}): no current — <b>arrange a pickup or your own shuttle</b> (drive shown above).`:'One-way float: leave a car at the take-out, or arrange your own shuttle (drive shown above).')} Conditions change — check <a href="index.html">Can I Swim Here?</a> before you go.</div>`;
  if(!oab && !samePoint) fetchDrive(plan.takeOut,plan.putIn,null,t=>{const el=document.getElementById('trip-drive');if(el)el.innerHTML=t.replace(/<\/?b>/g,'').split(' drive')[0];});
}
function setTimeMode(m){ plan.timeMode=m; if(!m)plan.timeISO=null; else if(!plan.timeISO){const d=new Date();d.setMinutes(0,0,0);d.setHours(d.getHours()+1);plan.timeISO=isoLocal(d);} renderTripPanel(); }
function onTime(v){ plan.timeISO=v; renderTripPanel(); }
function isoLocal(d){const p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;}

// ── share (stateless URL — no backend needed) ──────────────────────────────────
function planURL(){
  const u=new URL(location.href.split('?')[0]);
  u.searchParams.set('from',plan.putIn.id); u.searchParams.set('to',plan.takeOut.id);
  if(plan.kind==='oab') u.searchParams.set('trip','oab');
  if(plan.timeMode&&plan.timeISO){u.searchParams.set(plan.timeMode,plan.timeISO);}
  return u.toString();
}
function sharePlan(){
  const url=planURL();
  const title=plan.samePoint?`Meet & paddle: ${plan.putIn.name}`
    :`${plan.kind==='oab'?'Out-and-back':(plan.lake?'Paddle':'Float')} plan: ${plan.putIn.name}${plan.kind==='oab'?' ⟳ '+plan.takeOut.name:' → '+plan.takeOut.name}`;
  if(navigator.share){ navigator.share({title,text:title,url}).catch(()=>{}); return; }
  (navigator.clipboard?navigator.clipboard.writeText(url):Promise.reject())
    .then(()=>toast('🔗 Plan link copied'))
    .catch(()=>{ prompt('Copy this plan link:',url); });
}
function loadFromURL(){
  const q=new URLSearchParams(location.search);
  const from=q.get('from'),to=q.get('to'); if(!from||!to) return false;
  const pi=ACCESS.findIndex(a=>a.id===from), ti=ACCESS.findIndex(a=>a.id===to);
  if(pi<0||ti<0) return false;
  const kind=q.get('trip')==='oab'?'oab':'oneway';
  const mode=q.get('start')?'start':(q.get('end')?'end':null);
  buildTrip(pi,ti,kind,mode,mode?q.get(mode):null);
  return true;
}

// ── geolocate ──────────────────────────────────────────────────────────────────
function locateMe(){
  if(!navigator.geolocation){alert('Geolocation not supported.');return;}
  const btn=document.getElementById('locate');btn.textContent='⏳ Locating…';
  navigator.geolocation.getCurrentPosition(p=>{
    const la=p.coords.latitude,lo=p.coords.longitude;
    if(userMarker)userMarker.remove();
    userMarker=L.marker([la,lo],{icon:L.divIcon({className:'',html:'<div style="width:16px;height:16px;background:#2563EB;border:3px solid #fff;border-radius:50%;box-shadow:0 0 0 3px rgba(37,99,235,.35);"></div>',iconSize:[16,16],iconAnchor:[8,8]}),zIndexOffset:2000}).addTo(map);
    btn.textContent='📍 Near Me';btn.className='on';
    selectAccess(nearestAccess(la,lo));
  },()=>{btn.textContent='📍 Near Me';alert('Could not get your location.');},{enableHighAccuracy:true,timeout:12000});
}
map.on('click',e=>{ if(plan) return; if(ACCESS.length) selectAccess(nearestAccess(e.latlng.lat,e.latlng.lng)); });

// ── boot ────────────────────────────────────────────────────────────────────────
function fitAll(){const pts=ACCESS.map(a=>[a.lat,a.lon]);if(pts.length)map.fitBounds(L.latLngBounds(pts).pad(0.15));}
Promise.all([
  fetch('access_points.json').then(r=>r.json()).catch(()=>null),
  fetch('river_line.json').then(r=>r.json()).catch(()=>({reaches:{}})),
]).then(([acc,rl])=>{
  if(!acc){document.getElementById('hint').textContent='⚠️ Could not load access points.';return;}
  REACHES=rl.reaches||{};
  ACCESS=(acc.access||[]).slice().sort((a,b)=>(a.flow_mi==null?1e9:a.flow_mi)-(b.flow_mi==null?1e9:b.flow_mi));
  if(acc.speed_mph)SPEED=acc.speed_mph;
  drawMarkers();
  // load Can I Swim Here? data for the safety layer (non-blocking)
  loadFlow();
  fetch('stations.json').then(r=>r.json()).then(d=>{STATIONS=d.stations||[];if(plan)drawSafety();}).catch(()=>{});
  fetch('blooms.json').then(r=>r.json()).then(d=>{BLOOMS=d.blooms||[];if(plan)drawSafety();}).catch(()=>{});
  fetch('hazards.json').then(r=>r.json()).then(d=>{HAZARDS=d.hazards||[];drawSafety();}).catch(()=>{});
  if(!loadFromURL()) fitAll();
});
</script>
